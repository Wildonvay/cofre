/* ===== Tema COFRE: Militar Industrial. Tokens do kit (tokens/cores.json), centralizados aqui. ===== */
:root{
  --cofre-grafite:#151719;--cofre-aco:#303437;--cofre-ferrugem:#86502E;--cofre-bronze:#B38A52;--cofre-prata:#D5D8D8;--cofre-superficie:#202427;
  --cofre-texto-principal:#F0F1F0;--cofre-texto-secundario:#B8BDBD;--cofre-borda:#45494B;--cofre-alerta:#C48A40;--cofre-erro:#B64B40;--cofre-sucesso:#6E9176;
  /* papéis usados pelos componentes */
  --bg:var(--cofre-grafite);--sf:var(--cofre-superficie);--card:rgba(32,36,39,.94);--tile:var(--cofre-aco);--in:var(--cofre-grafite);--ln:var(--cofre-borda);
  --tx:var(--cofre-texto-principal);--t2:var(--cofre-texto-secundario);--pri:var(--cofre-bronze);--pri-b:#C9A16B;--on:#151719;--ac:#C9A16B;
  --st:var(--cofre-prata);--bz:var(--cofre-bronze);--em:#5F6567;
  /* situação: texto com contraste AA sobre a superfície; preenchimento nas cores oficiais */
  --ok:#8FB399;--wa:var(--cofre-alerta);--ba:#E0796D;--pr:#8FAFC8;
  --f-ok:var(--cofre-sucesso);--f-wa:var(--cofre-alerta);--f-ba:var(--cofre-erro);--f-pr:#6F93B3;
  --ovl:rgba(10,12,13,.70);--topbg:rgba(21,23,25,.90);--sombra:0 8px 28px rgba(0,0,0,.35);--raio:10px;color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* variante clara opcional (Mais > Aparência): as mesmas peças em aço claro, sem fundo fotográfico */
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#D9DCDC;--sf:#F0F1F0;--card:#F0F1F0;--tile:#D9DCDC;--in:#FFFFFF;--ln:#9DA2A3;--tx:#151719;--t2:#474C4F;--pri-b:#8C6A3A;--ac:#6F5122;--st:#303437;--bz:#8C6A3A;--em:#8A8F90;--ok:#3F6B4A;--wa:#7A4E12;--ba:#8F2F26;--pr:#2F5878;--ovl:transparent;--topbg:rgba(217,220,220,.94);--sombra:0 4px 14px rgba(0,0,0,.14);--foto:none;--sem-pelicula:transparent;color-scheme:light}}
:root[data-theme="light"]{--bg:#D9DCDC;--sf:#F0F1F0;--card:#F0F1F0;--tile:#D9DCDC;--in:#FFFFFF;--ln:#9DA2A3;--tx:#151719;--t2:#474C4F;--pri-b:#8C6A3A;--ac:#6F5122;--st:#303437;--bz:#8C6A3A;--em:#8A8F90;--ok:#3F6B4A;--wa:#7A4E12;--ba:#8F2F26;--pr:#2F5878;--ovl:transparent;--topbg:rgba(217,220,220,.94);--sombra:0 4px 14px rgba(0,0,0,.14);--foto:none;--sem-pelicula:transparent;color-scheme:light}
/* fundos por tela: imagem do kit sob película escura */
#app[data-tela="entrada"]{--fundo:url(fundos/05_porta_cofre_bronze.webp);--pos:left center}
#app[data-tela="painel"]{--fundo:url(fundos/04_metal_escuro.webp)}
#app[data-tela="docs"]{--fundo:url(fundos/03_cofre_industrial.webp)}
#app[data-tela="acervo"]{--fundo:url(fundos/06_cofre_militar_armas.webp);--pos:right center}
#app[data-tela="treinos"]{--fundo:url(fundos/02_arsenal_discreto.webp);--pos:70% center;--ovl-tela:rgba(10,12,13,.80)}
#app[data-tela="mais"]{--fundo:url(fundos/01_aco_minimalista.webp);--ovl-tela:rgba(10,12,13,.82)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Saira",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
h1,h2,h3,.ttl{font-family:"Russo One","Saira",system-ui,sans-serif;font-weight:400;letter-spacing:.02em;margin:0}
h1{font-size:26px;line-height:1.12}h2{font-size:17px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:3px}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative;isolation:isolate}
#app::before{content:"";position:fixed;inset:0;z-index:-2;background-color:var(--bg);background-image:var(--foto,var(--fundo,none));background-position:var(--pos,center);background-size:cover;background-repeat:no-repeat}
#app::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--sem-pelicula,var(--ovl-tela,var(--ovl)));pointer-events:none}
/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--topbg);height:56px;padding:0 8px 0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ln)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:linear-gradient(90deg,transparent,var(--cofre-ferrugem) 20%,var(--cofre-bronze) 50%,var(--cofre-ferrugem) 80%,transparent)}
.brand{display:flex;align-items:center;gap:10px}.brand .ttl{font-size:20px;letter-spacing:.08em}
/* ícones */
.ib{width:44px;height:44px;border:0;background:transparent;color:var(--t2);display:inline-flex;align-items:center;justify-content:center;border-radius:8px}
.ib:hover{color:var(--tx);background:rgba(127,127,127,.14)}
.ib svg,.nav svg,.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:15px;height:15px;stroke-width:2.2;vertical-align:-2px;margin-right:4px}
.ti{width:40px;height:40px;border-radius:8px;background:var(--tile);border:1px solid var(--ln);color:var(--ac);display:flex;align-items:center;justify-content:center;flex:none}
/* estrutura */
main{flex:1;padding:14px 16px 150px;display:flex;flex-direction:column;gap:18px;position:relative}
.sub{color:var(--t2);font-size:15px}.sm{font-size:13px;color:var(--t2)}
.sec{display:flex;flex-direction:column;gap:8px;position:relative}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
/* cartões e listas */
.card,.list,.empty,.note{background:var(--card);border:1px solid var(--ln);border-radius:var(--raio);box-shadow:var(--sombra)}
.card{padding:14px 16px}
.plate{padding:18px 18px 16px;background-image:radial-gradient(circle at 9px 9px,var(--em) 0 2.5px,transparent 3px),radial-gradient(circle at calc(100% - 9px) 9px,var(--em) 0 2.5px,transparent 3px),radial-gradient(circle at 9px calc(100% - 9px),var(--em) 0 2.5px,transparent 3px),radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),var(--em) 0 2.5px,transparent 3px)}
.list{padding:0 14px;overflow:hidden}
.row{min-height:62px;border:0;border-top:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;width:100%;background:transparent;text-align:left}
.list>.row:first-child{border-top:0}
button.row:hover,label.row:hover{background:linear-gradient(90deg,transparent,rgba(127,127,127,.12),transparent)}
.row .lf{display:flex;align-items:center;gap:12px;min-width:0}
.row b{display:block;font-weight:600}.row .r{text-align:right;flex:none}
.due{font-family:"Russo One","Saira",sans-serif;font-size:17px;display:block}
.st-ok{color:var(--ok)}.st-wa{color:var(--wa)}.st-ba{color:var(--ba)}.st-pr{color:var(--pr)}.st-ar{color:var(--t2)}
.chip{display:inline-flex;align-items:center;padding:4px 9px;border:1px solid currentColor;border-radius:6px;font-size:13px;font-weight:600}
.chip.fill{background:var(--f-ba);border-color:var(--f-ba);color:#fff}
.empty{padding:18px;color:var(--t2);font-size:15px;border-style:dashed}
.note{padding:12px 14px;font-size:14px;color:var(--t2)}
/* régua de 12 meses: a forma do marcador também indica a situação */
.rail{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.mo{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--t2)}
.dot{width:10px;height:10px;border-radius:50%}
.dot.d-ok{background:var(--f-ok)}.dot.d-wa{background:var(--f-wa);border-radius:1px;transform:rotate(45deg)}.dot.d-ba{background:var(--f-ba);border-radius:1px}.dot.d-pr{border:2px solid var(--f-pr)}
.slot{width:100%;height:16px;border-radius:3px;background:var(--tile);border:1px solid var(--ln)}
.slot.d-wa{border-color:var(--f-wa)}.slot.d-ba{border-color:var(--f-ba)}
/* contador em estilo carregador */
.segs{display:grid;gap:3px}.seg{height:10px;border-radius:2px;border:1px solid var(--em)}.seg.on{background:var(--pri);border-color:var(--pri-b)}
.hb{display:flex;justify-content:space-between;font-size:14px;margin-top:6px}
/* botões */
.btn{height:52px;padding:0 18px;border:1px solid var(--pri-b);border-radius:8px;background:var(--pri);color:var(--on);font-weight:700;font-size:16px;width:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 0 rgba(0,0,0,.35)}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.btn.sec2{background:var(--tile);color:var(--tx);border-color:var(--ln);font-weight:600}
.btn.danger{background:transparent;color:var(--ba);border-color:var(--ba);box-shadow:none;font-weight:600}
.btn:disabled{opacity:.55;cursor:progress;filter:none}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{height:44px;padding:0 14px;border:1px solid var(--ln);border-radius:8px;background:var(--card);font-size:14px;font-weight:500}
.tab:hover{border-color:var(--pri-b)}
.tab.on{background:var(--pri);color:var(--on);border-color:var(--pri-b);font-weight:700}
.fab{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;pointer-events:none}
.fab>div{max-width:560px;margin:0 auto;padding:12px 16px}.fab .btn{pointer-events:auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 18px rgba(0,0,0,.5)}
/* navegação: a aba ativa tem cor, peso e uma barra no topo */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav>div{max-width:560px;margin:0 auto;height:64px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button{border:0;border-top:3px solid transparent;background:transparent;color:var(--t2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px}
.nav button:hover{color:var(--tx)}
.nav button.on{color:var(--ac);font-weight:700;border-top-color:var(--pri)}
/* folhas e formulários */
.ovl{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sf);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;border:1px solid var(--ln);border-bottom:0;border-top:3px solid var(--pri)}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet .list{box-shadow:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--t2)}
.in{height:48px;border:1px solid var(--ln);border-radius:8px;background:var(--in);padding:0 12px;color:var(--tx);width:100%;font-size:16px}
.in:hover{border-color:var(--em)}.in:focus{border-color:var(--pri)}
textarea.in{height:auto;min-height:80px;padding:10px 12px}
.err{color:var(--ba);font-size:14px;min-height:20px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--cofre-prata);color:#151719;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;max-width:86%;text-align:center;box-shadow:var(--sombra)}
/* entrada */
.gate{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px}

.gate .bx{padding:20px 18px 22px;display:flex;flex-direction:column;gap:14px;background:var(--card);border:1px solid var(--ln);border-radius:var(--raio);box-shadow:var(--sombra)}
.slogan{font-family:"Russo One","Saira",sans-serif;font-size:18px;line-height:1.25}

/* abertura do cofre ao entrar */
.abre{position:fixed;inset:0;z-index:50;perspective:900px}
.abre>*{position:absolute;left:50%;top:50%}
.abre .vao{width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;box-shadow:0 0 0 200vmax #151719;animation:vao .55s 1.05s ease-in forwards}
.abre .moldura{width:236px;height:236px;margin:-118px 0 0 -118px;border-radius:50%;border:18px solid #D5D8D8;animation:some .3s 1.05s ease-in forwards}
.abre .dob{width:36px;height:22px;margin-left:-150px;border-radius:5px;background:#D5D8D8;animation:some .3s 1.05s ease-in forwards}
.abre .porta{width:204px;height:204px;margin:-102px 0 0 -102px;transform-origin:0 50%;animation:porta .7s .45s cubic-bezier(.5,0,.3,1) forwards}
.abre .porta svg{position:absolute;inset:0;width:100%;height:100%}
.abre .volante{animation:gira .45s ease-in-out forwards}
@keyframes gira{to{transform:rotate(135deg)}}
@keyframes porta{75%{opacity:1}to{transform:rotateY(-104deg);opacity:0}}
@keyframes some{to{opacity:0}}
@keyframes vao{to{transform:scale(15)}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
@media (prefers-reduced-motion:reduce){.abre{display:none}*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body>
<div id="app"></div>
<script>
'use strict';
/* ============ COFRE: gestão de documentos, guias e prazos para CAC ============
   Tudo fica neste aparelho, cifrado com a senha do usuário (AES-GCM, chave PBKDF2).
   Nenhum dado é enviado a servidor. ========================================== */

// ---------- utilidades ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* sem armazenamento */ } },
};
const enc = new TextEncoder(), dec = new TextDecoder();
const rand = (n) => crypto.getRandomValues(new Uint8Array(n));
function b64e(buf) { const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }
function b64d(str) { const s = atob(str), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }

// ---------- datas ----------
const pad = (n) => String(n).padStart(2, '0');
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function hoje() { return iso(new Date()); }
function dt(s) { const p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function fmt(s) { if (!s) return ''; const p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function diasAte(s) { return Math.round((dt(s) - dt(hoje())) / 86400000); }
function prazoTxt(n) {
  if (n < 0) return 'há ' + (-n) + (n === -1 ? ' dia' : ' dias');
  if (n === 0) return 'hoje';
  if (n < 60) return n + (n === 1 ? ' dia' : ' dias');
  const m = Math.round(n / 30.44); return m < 24 ? m + ' meses' : Math.round(n / 365.25) + ' anos';
}

// ---------- modelo ----------
const TIPOS = {
  CR: { nome: 'CR', longo: 'Certificado de registro', dias: 120 },
  CRAF: { nome: 'CRAF', longo: 'Registro da arma', dias: 90 },
  GT: { nome: 'Guia de tráfego', longo: 'Guia de tráfego', dias: 30 },
  CLUBE: { nome: 'Filiação a clube', longo: 'Filiação a clube de tiro', dias: 30 },
  LAUDO: { nome: 'Laudo ou certidão', longo: 'Laudo ou certidão', dias: 30 },
  IBAMA: { nome: 'Autorização de manejo', longo: 'Autorização de manejo (IBAMA)', dias: 60 },
  PROP: { nome: 'Autorização de proprietário', longo: 'Autorização de proprietário rural', dias: 30 },
  OUTRO: { nome: 'Outro documento', longo: 'Outro documento', dias: 30 },
};
const FINS = { '': 'Não se aplica', treino: 'Treino', competicao: 'Competição', caca: 'Caça ou manejo' };
const ACERVOS = { tiro: 'Tiro desportivo', caca: 'Caça', colecao: 'Coleção' };
const ARMAS_T = ['Pistola', 'Revólver', 'Espingarda', 'Carabina ou rifle', 'Fuzil', 'Outro'];
const AMBITOS = { clube: 'Clube', estadual: 'Estadual ou regional', nacional: 'Nacional', internacional: 'Internacional' };
function novoCofre() {
  const ant = {}; Object.keys(TIPOS).forEach((k) => { ant[k] = TIPOS[k].dias; });
  return {
    v: 1, criado: hoje(), perfil: { nome: '', email: '', nivel: '1' }, tema: 'dark', antecedencia: ant,
    // Padrão sugerido a partir do Decreto 11.615/2023. O usuário confere e ajusta em Mais > Metas.
    metas: { 1: { treinos: 8, comp: 0 }, 2: { treinos: 12, comp: 4 }, 3: { treinos: 20, comp: 6 } },
    armas: [], docs: [], treinos: [], ultimoBackup: '',
  };
}
let S = null;       // dados abertos (só em memória)
let KEY = null;     // chave bruta do cofre (só em memória)
let rota = 'painel', filtroDocs = 'vig', saiuEm = 0;

// ---------- criptografia ----------
const ITER = 310000;
async function derivar(senha, salt, iter) {
  const km = await crypto.subtle.importKey('raw', enc.encode(senha), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' }, km, 256));
}
async function aes(raw) { return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']); }
async function selar(raw, obj) {
  const iv = rand(12);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, await aes(raw), enc.encode(JSON.stringify(obj)));
  return { iv: b64e(iv), ct: b64e(ct) };
}
async function abrir(raw, box) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(box.iv) }, await aes(raw), b64d(box.ct));
  return JSON.parse(dec.decode(pt));
}
function cofreSalvo() { try { const v = JSON.parse(LS.get('cofre.vault') || 'null'); return v && v.app === 'cofre' ? v : null; } catch (e) { return null; } }
async function salvar() {
  const antigo = cofreSalvo();
  const box = await selar(KEY, S);
  const ok = LS.set('cofre.vault', JSON.stringify({ app: 'cofre', v: 1, salt: antigo.salt, iter: antigo.iter, iv: box.iv, ct: box.ct, salvo: new Date().toISOString() }));
  if (!ok) toast('Não foi possível gravar neste aparelho. Faça um backup agora.');
}
async function criarCofre(senha) {
  const salt = rand(16);
  KEY = await derivar(senha, salt, ITER);
  S = novoCofre();
  const box = await selar(KEY, S);
  if (!LS.set('cofre.vault', JSON.stringify({ app: 'cofre', v: 1, salt: b64e(salt), iter: ITER, iv: box.iv, ct: box.ct, salvo: new Date().toISOString() }))) throw new Error('armazenamento');
}
async function destrancar(senha) {
  const v = cofreSalvo();
  const raw = await derivar(senha, b64d(v.salt), v.iter);
  S = migrar(await abrir(raw, v)); KEY = raw;
}
function migrar(d) { const base = novoCofre(); Object.keys(base).forEach((k) => { if (d[k] === undefined) d[k] = base[k]; }); Object.keys(TIPOS).forEach((k) => { if (d.antecedencia[k] == null) d.antecedencia[k] = TIPOS[k].dias; }); return d; }
function trancar() { S = null; KEY = null; fecharFolha(); render(); }

// ---------- biometria (WebAuthn com PRF): a digital ou o rosto liberam a chave guardada ----------
function bioSalva() { try { return JSON.parse(LS.get('cofre.bio') || 'null'); } catch (e) { return null; } }
function bioPossivel() { return !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext); }
async function prfDe(credId, sal) {
  const as = await navigator.credentials.get({ publicKey: { challenge: rand(32), rpId: location.hostname, allowCredentials: [{ type: 'public-key', id: credId }], userVerification: 'required', extensions: { prf: { eval: { first: sal } } } } });
  const r = as.getClientExtensionResults();
  if (!r.prf || !r.prf.results || !r.prf.results.first) throw new Error('prf');
  return new Uint8Array(r.prf.results.first);
}
async function ativarBio() {
  if (!bioPossivel()) throw new Error('indisponivel');
  const sal = rand(32);
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: rand(32), rp: { name: 'COFRE', id: location.hostname },
    user: { id: rand(16), name: 'cofre', displayName: 'COFRE' },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
    extensions: { prf: { eval: { first: sal } } },
  } });
  const ext = cred.getClientExtensionResults();
  let seg = ext.prf && ext.prf.results && ext.prf.results.first ? new Uint8Array(ext.prf.results.first) : null;
  if (!seg) { if (!ext.prf || !ext.prf.enabled) throw new Error('prf'); seg = await prfDe(new Uint8Array(cred.rawId), sal); }
  const box = await selar(seg, { k: b64e(KEY) });
  LS.set('cofre.bio', JSON.stringify({ id: b64e(cred.rawId), sal: b64e(sal), iv: box.iv, ct: box.ct }));
}
async function destrancarBio() {
  const b = bioSalva();
  const seg = await prfDe(b64d(b.id), b64d(b.sal));
  const raw = b64d((await abrir(seg, b)).k);
  S = migrar(await abrir(raw, cofreSalvo())); KEY = raw;
}

// ---------- regras de situação ----------
function situacao(d) {
  if (d.arquivado) return { c: 'ar', t: d.arquivado.motivo === 'renovado' ? 'Renovado' : 'Arquivado', n: null };
  const n = d.validade ? diasAte(d.validade) : null;
  if (d.protData || d.protNum) return { c: 'pr', t: 'Protocolado', n: n };
  if (n == null) return { c: 'ok', t: 'Sem validade', n: null };
  if (n < 0) return { c: 'ba', t: 'Vencido', n: n };
  if (n <= (S.antecedencia[d.tipo] || 30)) return { c: 'wa', t: 'Atenção', n: n };
  return { c: 'ok', t: 'Em dia', n: n };
}
const ativos = () => S.docs.filter((d) => !d.arquivado);
const arma = (id) => S.armas.find((a) => a.id === id);
function docSub(d) { const a = arma(d.armaId); const p = []; if (a) p.push(a.nome); if (d.descricao) p.push(d.descricao); if (d.tipo === 'GT' && d.finalidade) p.push(FINS[d.finalidade].toLowerCase()); return p.join(', '); }
function porValidade(a, b) { return (a.validade || '9999') < (b.validade || '9999') ? -1 : 1; }

// Habitualidade: sessões dos últimos 12 meses, por grupo de calibre, contra a meta do nível.
function habitualidade() {
  const lim = new Date(); lim.setFullYear(lim.getFullYear() - 1); const corte = iso(lim);
  const meta = S.metas[S.perfil.nivel] || { treinos: 0, comp: 0 };
  const g = {};
  S.armas.filter((a) => a.acervo === 'tiro' && a.calibre).forEach((a) => { g[a.calibre] = g[a.calibre] || { cal: a.calibre, tr: 0, co: 0, antiga: '' }; });
  S.treinos.filter((t) => t.data > corte && t.calibre).forEach((t) => {
    const x = g[t.calibre] = g[t.calibre] || { cal: t.calibre, tr: 0, co: 0, antiga: '' };
    if (t.tipo === 'competicao') x.co++; else x.tr++;
    if (!x.antiga || t.data < x.antiga) x.antiga = t.data;
  });
  return Object.keys(g).sort().map((k) => {
    const x = g[k];
    // Sem meta de competições, a meta de treinos aceita treino ou competição.
    const feitos = meta.comp ? x.tr : x.tr + x.co;
    x.faltaTr = Math.max(0, meta.treinos - feitos); x.faltaCo = Math.max(0, meta.comp - x.co); x.feitos = feitos; x.meta = meta;
    if (x.antiga) { const s = dt(x.antiga); s.setFullYear(s.getFullYear() + 1); x.sai = iso(s); }
    return x;
  });
}

// Conferência antes de sair: o que precisa estar válido para aquela arma e finalidade.
function conferir(armaId, fim) {
  const a = arma(armaId), itens = [];
  const vale = (d) => { const s = situacao(d); return s.c === 'ok' || s.c === 'wa' || (s.c === 'pr' && (s.n == null || s.n >= 0)); };
  const acha = (f) => ativos().filter(f);
  const add = (nome, lista, falta) => { const bom = lista.filter(vale); itens.push({ nome: nome, ok: bom.length > 0, det: bom.length ? (bom[0].validade ? 'válido até ' + fmt(bom[0].validade) : 'sem data de validade') : (lista.length ? 'vencido' : falta) }); };
  add('CR', acha((d) => d.tipo === 'CR'), 'não cadastrado');
  add('CRAF de ' + a.nome, acha((d) => d.tipo === 'CRAF' && d.armaId === armaId), 'não cadastrado');
  add('Guia de tráfego para ' + FINS[fim].toLowerCase(), acha((d) => d.tipo === 'GT' && d.armaId === armaId && (!d.finalidade || d.finalidade === fim)), 'nenhuma guia para esta arma e finalidade');
  if (fim === 'caca') {
    add('Autorização de manejo (IBAMA)', acha((d) => d.tipo === 'IBAMA'), 'não cadastrada');
    add('Autorização de proprietário', acha((d) => d.tipo === 'PROP'), 'nenhuma cadastrada');
  } else {
    add('Filiação a clube', acha((d) => d.tipo === 'CLUBE'), 'não cadastrada');
  }
  return itens;
}

// ---------- arquivos: backup, e-mail e agenda ----------
function backupTexto() { const v = cofreSalvo(); return JSON.stringify({ app: 'cofre', tipo: 'backup', v: 1, gerado: new Date().toISOString(), cofre: v }); }
async function baixar(nome, texto, mime) {
  const blob = new Blob([texto], { type: mime });
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: nome, data: blob }); return true; }
    catch (e) { if (!e || e.code !== 'declined') toast('Esta prévia não consegue salvar este tipo de arquivo. No app instalado funciona.'); return false; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000); return true;
}
async function compartilhar(nome, texto, mime, titulo, msg) {
  try {
    const f = new File([texto], nome, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: titulo, text: msg }); return 'ok'; }
  } catch (e) { return e && e.name === 'AbortError' ? 'cancelou' : 'nao'; }
  return 'nao';
}
async function marcarBackup() { S.ultimoBackup = hoje(); await salvar(); render(); }
async function fazerBackup() {
  await marcarBackup();
  if (await baixar('cofre-backup-' + hoje() + '.txt', backupTexto(), 'text/plain')) toast('Backup salvo. Ele só abre com a sua senha.');
}
async function backupEmail() {
  const em = S.perfil.email;
  if (!em) { toast('Cadastre o e-mail em Perfil antes de enviar.'); return editarPerfil(); }
  await marcarBackup();
  const nome = 'cofre-backup-' + hoje() + '.txt', txt = backupTexto();
  try { await navigator.clipboard.writeText(em); } catch (e) { /* sem área de transferência */ }
  const r = await compartilhar(nome, txt, 'text/plain', 'Backup do COFRE', 'Backup do COFRE de ' + fmt(hoje()) + '. Enviar para ' + em + '. O arquivo só abre com a senha do cofre.');
  if (r === 'ok') return toast('Escolha o app de e-mail. O endereço ' + em + ' foi copiado para colar no destinatário.');
  if (r === 'cancelou') return;
  await baixar(nome, txt, 'text/plain');
  location.href = 'mailto:' + encodeURIComponent(em) + '?subject=' + encodeURIComponent('Backup do COFRE ' + fmt(hoje())) + '&body=' + encodeURIComponent('Anexe a este e-mail o arquivo ' + nome + ', que acabou de ser salvo no aparelho. Ele só abre com a senha do cofre.');
}
function icsTexto() {
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//COFRE//Lembretes//PT-BR', 'CALSCALE:GREGORIAN'];
  const lim = (s) => String(s).replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
  const carimbo = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  ativos().filter((d) => d.validade).forEach((d) => {
    const fim = dt(d.validade); fim.setDate(fim.getDate() + 1);
    const n = S.antecedencia[d.tipo] || 30, sub = docSub(d);
    L.push('BEGIN:VEVENT', 'UID:' + d.id + '@cofre', 'DTSTAMP:' + carimbo, 'DTSTART;VALUE=DATE:' + d.validade.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + iso(fim).replace(/-/g, ''),
      'SUMMARY:' + lim('Vence: ' + TIPOS[d.tipo].nome + (sub ? ' (' + sub + ')' : '')), 'DESCRIPTION:' + lim('Lembrete criado pelo COFRE. Confira o prazo de renovação na norma vigente.'), 'TRANSP:TRANSPARENT');
    [n, 7, 1].filter((x, i, a) => a.indexOf(x) === i).forEach((x) => L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + lim(TIPOS[d.tipo].nome + ' vence em ' + x + (x === 1 ? ' dia' : ' dias')), 'TRIGGER:-P' + x + 'D', 'END:VALARM'));
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR'); return L.join('\r\n');
}
async function exportarAgenda() {
  if (!ativos().some((d) => d.validade)) return toast('Cadastre um documento com validade primeiro.');
  const r = await compartilhar('cofre-lembretes.ics', icsTexto(), 'text/calendar', 'Lembretes do COFRE', 'Abra com o app de agenda para criar os lembretes.');
  if (r === 'ok' || r === 'cancelou') return;
  if (await baixar('cofre-lembretes.ics', icsTexto(), 'text/calendar')) toast('Arquivo salvo. Abra com o app de agenda para criar os lembretes.');
}
function restaurar(arq) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const b = JSON.parse(fr.result), v = b && b.cofre;
      if (!b || b.app !== 'cofre' || !v || !v.salt || !v.ct) throw new Error('formato');
      folha({ titulo: 'Restaurar backup', texto: 'Backup de ' + fmt(String(b.gerado).slice(0, 10)) + '. Ele substitui tudo o que está neste aparelho. Digite a senha usada naquele backup.',
        campos: [{ n: 'senha', l: 'Senha do backup', t: 'password' }], botao: 'Restaurar',
        salvar: async (x) => {
          let raw, dados;
          try { raw = await derivar(x.senha, b64d(v.salt), v.iter); dados = await abrir(raw, v); } catch (e) { return 'Senha incorreta para este backup.'; }
          LS.set('cofre.vault', JSON.stringify(v)); LS.del('cofre.bio'); S = migrar(dados); KEY = raw; rota = 'painel'; toast('Backup restaurado.');
        } });
    } catch (e) { toast('Este arquivo não é um backup do COFRE.'); }
  };
  fr.readAsText(arq);
}

// Monta um ícone do conjunto: "caminho|c cx,cy,r". cls: classe extra (s = pequeno, de situação).
function ic(nome, cls) {
  const p = (I[nome] || I.d_OUTRO).split('|');
  return '<svg class="ic' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (p[0] ? '<path d="' + p[0] + '"/>' : '') +

}

// ---------- interface: base ----------
let tmr = 0;
function toast(msg) { let t = $('.toast'); if (t) t.remove(); t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); clearTimeout(tmr); tmr = setTimeout(() => t.remove(), 4200); }
function aplicarTema() { const t = S ? S.tema : (LS.get('cofre.tema') || 'dark'); if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }
let folhaAtual = null;
function fecharFolha() { const o = $('.ovl'); if (o) o.remove(); folhaAtual = null; }
// Folha de formulário: campos = [{n, l, t, v, o, ph}]
function folha(cfg) {
  fecharFolha(); folhaAtual = cfg;

  const velho = S.docs.find((x) => x.id === id);
  const d = Object.assign(docVazio(), { tipo: velho.tipo, armaId: velho.armaId, descricao: velho.descricao, finalidade: velho.finalidade, emissao: hoje() });
  folha({ titulo: 'Nova versão do documento', texto: 'A versão atual vai para o histórico e continua guardada.', campos: camposDoc(d),
    salvar: (v) => { velho.arquivado = { em: hoje(), motivo: 'renovado' }; S.docs.push(Object.assign({ id: uid(), serie: velho.serie, criado: hoje() }, v)); filtroDocs = 'vig'; toast('Nova versão guardada. A anterior está no histórico.'); } });
}
function verDoc(id) {
  const d = S.docs.find((x) => x.id === id), s = situacao(d), sub = docSub(d);
  const lin = (r, v) => (v ? '<div class="chk"><span class="sm" style="width:120px;flex:none">' + r + '</span><span>' + esc(v) + '</span></div>' : '');
  const vers = S.docs.filter((x) => x.serie === d.serie && x.id !== d.id).sort((a, b) => ((a.emissao || a.criado) < (b.emissao || b.criado) ? 1 : -1));
  folha({ titulo: TIPOS[d.tipo].longo, foco: false, html:
    '<p><span class="chip ' + (s.c === 'ba' ? 'fill' : 'st-' + s.c) + '">' + ic('s_' + s.c, 's') + s.t + '</span>' + (s.n != null && !d.arquivado ? ' <span class="sm">' + (s.n < 0 ? 'venceu ' + prazoTxt(s.n) : s.n === 0 ? 'vence hoje' : 'vence em ' + prazoTxt(s.n)) + '</span>' : '') + '</p>' +
    lin('Referência', sub) + lin('Número', d.numero) + lin('Emissão', fmt(d.emissao)) + lin('Validade', fmt(d.validade)) + lin('Protocolo', [d.protNum, fmt(d.protData)].filter(Boolean).join(', ')) +
    lin('Arquivado em', d.arquivado ? fmt(d.arquivado.em) : '') + lin('Observações', d.obs) +
    '<div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">' +
    (d.arquivado ? '' : '<button class="btn" data-a="doc-renovar" data-id="' + d.id + '">Guardar nova versão (renovação)</button>') +
    '<button class="btn sec2" data-a="doc-editar" data-id="' + d.id + '">Editar</button>' +
    (d.arquivado ? '' : '<button class="btn sec2" data-a="doc-arquivar" data-id="' + d.id + '">Arquivar sem renovar</button>') + '</div>' +
    (vers.length ? '<h2 style="margin-top:8px">Outras versões</h2><div class="list">' + vers.map(linhaDoc).join('') + '</div>' : '') });
}
function editarTreino(id) {
  const t = id ? S.treinos.find((x) => x.id === id) : { data: hoje(), tipo: 'treino', ambito: 'clube', clube: (S.treinos[S.treinos.length - 1] || {}).clube || '', armaId: '', calibre: '', obs: '' };
  folha({ titulo: id ? 'Editar sessão' : 'Registrar sessão', campos: [
    { n: 'data', l: 'Data', t: 'date', v: t.data },
    { n: 'tipo', l: 'Tipo', t: 'select', v: t.tipo, o: [['treino', 'Treino'], ['competicao', 'Competição']] },
    { n: 'ambito', l: 'Âmbito (para competição)', t: 'select', v: t.ambito, o: Object.keys(AMBITOS).map((k) => [k, AMBITOS[k]]) },
    { n: 'clube', l: 'Clube ou entidade', v: t.clube },
    { n: 'armaId', l: 'Arma usada', t: 'select', v: t.armaId, o: opArmas('Não informar') },
    { n: 'calibre', l: 'Calibre (em branco usa o da arma)', v: t.calibre },
    { n: 'obs', l: 'Comprovante ou observações', t: 'textarea', v: t.obs },
  ], salvar: (v) => {
    if (!v.data) return 'Informe a data.';
    if (v.data > hoje()) return 'A data não pode ser futura.';
    if (!v.calibre && v.armaId) v.calibre = (arma(v.armaId) || {}).calibre || '';
    if (!v.calibre) return 'Informe o calibre ou escolha uma arma com calibre cadastrado.';
    if (v.tipo !== 'competicao') v.ambito = '';
    if (id) Object.assign(t, v); else S.treinos.push(Object.assign({ id: uid() }, v));
  }, excluir: id ? () => { S.treinos = S.treinos.filter((x) => x.id !== id); } : null });
}
function editarPerfil() {
  folha({ titulo: 'Perfil', campos: [
    { n: 'nome', l: 'Nome', v: S.perfil.nome },
    { n: 'email', l: 'E-mail para receber o backup', t: 'email', v: S.perfil.email, ph: 'voce@exemplo.com' },
    { n: 'nivel', l: 'Nível de atirador', t: 'select', v: S.perfil.nivel, o: [['1', 'Nível 1'], ['2', 'Nível 2'], ['3', 'Nível 3']] },
  ], salvar: (v) => { if (v.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) return 'Confira o e-mail.'; S.perfil = v; } });
}
function editarAlertas() {
  folha({ titulo: 'Antecedência dos alertas', texto: 'Dias antes do vencimento em que cada documento entra em atenção. Vale também para os alarmes da agenda.',
    campos: Object.keys(TIPOS).map((k) => ({ n: k, l: TIPOS[k].longo, t: 'number', v: S.antecedencia[k] })),
    salvar: (v) => { for (const k in v) { const n = parseInt(v[k], 10); if (!(n >= 0 && n <= 730)) return 'Use de 0 a 730 dias em ' + TIPOS[k].longo + '.'; S.antecedencia[k] = n; } } });
}
function editarMetas() {
  const c = []; [1, 2, 3].forEach((n) => { c.push({ n: 't' + n, l: 'Nível ' + n + ': treinos em 12 meses', t: 'number', v: S.metas[n].treinos }, { n: 'c' + n, l: 'Nível ' + n + ': competições em 12 meses', t: 'number', v: S.metas[n].comp }); });
  folha({ titulo: 'Metas de habitualidade', texto: 'Valores sugeridos a partir do Decreto 11.615/2023. Confira a norma vigente e ajuste aqui. A contagem é por grupo de calibre.', campos: c,
    salvar: (v) => { for (const k in v) { const n = parseInt(v[k], 10); if (!(n >= 0 && n <= 60)) return 'Use números de 0 a 60.'; S.metas[k[1]][k[0] === 't' ? 'treinos' : 'comp'] = n; } } });
}
function escolherTema() {
  folha({ titulo: 'Aparência', campos: [{ n: 'tema', l: 'Tema', t: 'select', v: S.tema, o: [['dark', 'Militar industrial (escuro)'], ['light', 'Aço claro'], ['auto', 'Seguir o aparelho']] }],
    salvar: (v) => { S.tema = v.tema; LS.set('cofre.tema', v.tema); aplicarTema(); } });
}
function trocarSenha() {
  folha({ titulo: 'Trocar a senha', texto: 'Os backups antigos continuam abrindo só com a senha antiga.', campos: [
    { n: 'atual', l: 'Senha atual', t: 'password' }, { n: 'nova', l: 'Nova senha (mínimo de 8 caracteres)', t: 'password' }, { n: 'nova2', l: 'Repita a nova senha', t: 'password' }],
    botao: 'Trocar a senha', salvar: async (v) => {
      const c = cofreSalvo(); const at = await derivar(v.atual, b64d(c.salt), c.iter);
      if (b64e(at) !== b64e(KEY)) return 'A senha atual não confere.';
      if (v.nova.length < 8) return 'Use ao menos 8 caracteres.';
      if (v.nova !== v.nova2) return 'As senhas não são iguais.';
      const salt = rand(16); KEY = await derivar(v.nova, salt, ITER);
      const box = await selar(KEY, S);
      LS.set('cofre.vault', JSON.stringify({ app: 'cofre', v: 1, salt: b64e(salt), iter: ITER, iv: box.iv, ct: box.ct, salvo: new Date().toISOString() }));
      LS.del('cofre.bio'); toast('Senha trocada. Se usava biometria, ative de novo.');
    } });
}
function abrirConferencia() {
  if (!S.armas.length) { toast('Cadastre uma arma primeiro.'); rota = 'acervo'; return render(); }
  const desenha = () => {
    const o = $('.ovl'), a = $('[name="armaId"]', o).value, f = $('[name="fim"]', o).value;
    const it = conferir(a, f), bom = it.every((x) => x.ok);
    $('#conf', o).innerHTML = '<p class="chip ' + (bom ? 'st-ok' : 'fill') + '" style="margin:6px 0">' + ic(bom ? 's_ok' : 's_ba', 's') + (bom ? 'Pode sair' : 'Há pendência') + '</p>' +
      it.map((x) => '<div class="chk">' + (x.ok ? I.sim : I.nao) + '<span><b style="display:block">' + esc(x.nome) + '</b><span class="sm">' + esc(x.det) + '</span></span></div>').join('');
  };
  folha({ titulo: 'Conferir antes de sair', foco: false, campos: [
    { n: 'armaId', l: 'Arma', t: 'select', v: S.armas[0].id, o: S.armas.map((a) => [a.id, a.nome]) },
    { n: 'fim', l: 'Finalidade', t: 'select', v: 'treino', o: [['treino', 'Treino'], ['competicao', 'Competição'], ['caca', 'Caça ou manejo']] }],
    html: '<div id="conf" aria-live="polite"></div>' });
  const o = $('.ovl'); o.addEventListener('change', desenha); $('.sheet', o).appendChild($('#conf', o)); desenha();
}

// ---------- renderização e eventos ----------
function render() {
  const app = $('#app');
  aplicarTema();
  app.dataset.tela = S ? rota : 'entrada';
  if (!S) { app.innerHTML = telaEntrada(); return; }
  const v = { painel: vPainel, acervo: vAcervo, docs: vDocs, treinos: vTreinos, mais: vMais }[rota]();
  const nb = (k, t) => '<button data-a="ir" data-id="' + k + '" class="' + (rota === k ? 'on' : '') + '"' + (rota === k ? ' aria-current="page"' : '') + '>' + I[k] + '<span>' + t + '</span></button>';
  app.innerHTML = '<header class="top"><div class="brand">' + I.logo + '<span class="ttl">COFRE</span></div><button class="ib" data-a="trancar" aria-label="Trancar o cofre">' + I.cadeado + '</button></header>' +
    '<main>' + v + '</main><nav class="nav" aria-label="Seções"><div>' + nb('painel', 'Painel') + nb('acervo', 'Acervo') + nb('docs', 'Documentos') + nb('treinos', 'Treinos') + nb('mais', 'Mais') + '</div></nav>';
}
const ACOES = {
  entrar: entrar, 'entrar-bio': entrarBio, criar: criar, trancar: trancar, fechar: fecharFolha, 'folha-salvar': folhaSalvar,
  'folha-excluir': async () => { const c = folhaAtual; if (!confirm('Confirma a exclusão? Não dá para desfazer.')) return; c.excluir(); fecharFolha(); await salvar(); render(); },
  ir: (id) => { rota = id; render(); window.scrollTo(0, 0); },
  filtro: (id) => { filtroDocs = id; render(); },
  conferir: abrirConferencia, 'arma-nova': () => editarArma(), arma: editarArma, 'doc-novo': () => editarDoc(), doc: verDoc, 'doc-editar': editarDoc, 'doc-renovar': renovarDoc,
  'doc-arquivar': async (id) => { if (!confirm('Arquivar este documento sem renovar? Ele vai para o histórico.')) return; S.docs.find((x) => x.id === id).arquivado = { em: hoje(), motivo: 'arquivado' }; fecharFolha(); await salvar(); render(); },
  'treino-novo': () => editarTreino(), treino: editarTreino, perfil: editarPerfil, alertas: editarAlertas, metas: editarMetas, tema: escolherTema, senha: trocarSenha,
  'bk-salvar': fazerBackup, 'bk-email': backupEmail, agenda: exportarAgenda,
  'bio-on': async () => { const e = await tentarBio(); if (e) toast(e); render(); },
  'bio-off': () => { LS.del('cofre.bio'); toast('Biometria desativada.'); render(); },
  apagar: () => { if (!confirm('Apagar todos os dados do COFRE neste aparelho? Sem backup, não há como recuperar.')) return; if (!confirm('Tem certeza? Esta é a última confirmação.')) return; LS.del('cofre.vault'); LS.del('cofre.bio'); S = null; KEY = null; render(); },
};
document.addEventListener('click', (e) => {
  const o = e.target.closest('.ovl'); if (o && e.target === o) return fecharFolha();
  const b = e.target.closest('[data-a]'); if (!b || b.tagName === 'INPUT') return;
  const f = ACOES[b.dataset.a]; if (f) f(b.dataset.id);
});
document.addEventListener('change', (e) => { if (e.target.dataset && e.target.dataset.a === 'restaurar' && e.target.files[0]) { restaurar(e.target.files[0]); e.target.value = ''; } });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') fecharFolha();
  if (e.key === 'Enter' && !S && e.target.tagName === 'INPUT') { const b = $('[data-a="entrar"],[data-a="criar"]'); if (b) b.click(); }
});
// Tranca sozinho depois de 5 minutos fora da tela.
document.addEventListener('visibilitychange', () => { if (document.hidden) saiuEm = Date.now(); else if (S && saiuEm && Date.now() - saiuEm > 300000) trancar(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
